[/Script/Engine.InputSettings]

; -----------------------
; AXIS CONFIG (sensibilités / deadzones)
; -----------------------
+AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.25,Sensitivity=1.0,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_LeftY",AxisProperties=(DeadZone=0.25,Sensitivity=1.0,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightX",AxisProperties=(DeadZone=0.25,Sensitivity=1.0,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightY",AxisProperties=(DeadZone=0.25,Sensitivity=1.0,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.0,Sensitivity=0.07,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.0,Sensitivity=0.07,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="Mouse2D",AxisProperties=(DeadZone=0.0,Sensitivity=0.07,Exponent=1.0,bInvert=False))

; --------------------------------------------------
; 🎮 AXIS MAPPINGS (clavier + flèches + manette)
; --------------------------------------------------
+AxisMappings=(AxisName="MoveForward",Key=W,Scale=1.0)
+AxisMappings=(AxisName="MoveForward",Key=S,Scale=-1.0)
+AxisMappings=(AxisName="MoveForward",Key=Up,Scale=1.0)
+AxisMappings=(AxisName="MoveForward",Key=Down,Scale=-1.0)
+AxisMappings=(AxisName="MoveForward",Key=Gamepad_LeftY,Scale=1.0)

+AxisMappings=(AxisName="MoveRight",Key=D,Scale=1.0)
+AxisMappings=(AxisName="MoveRight",Key=A,Scale=-1.0)
+AxisMappings=(AxisName="MoveRight",Key=Right,Scale=1.0)
+AxisMappings=(AxisName="MoveRight",Key=Left,Scale=-1.0)
+AxisMappings=(AxisName="MoveRight",Key=Gamepad_LeftX,Scale=1.0)

+AxisMappings=(AxisName="Turn",Key=MouseX,Scale=1.0)
+AxisMappings=(AxisName="Turn",Key=Gamepad_RightX,Scale=1.0)

+AxisMappings=(AxisName="LookUp",Key=MouseY,Scale=-1.0)
+AxisMappings=(AxisName="LookUp",Key=Gamepad_RightY,Scale=1.0)

; --------------------------------------------------
; 🎮 ACTION MAPPINGS (clavier + manette)
; --------------------------------------------------
; Wingsuit toggle: clavier = E, manette = A (FaceButton_Bottom)
+ActionMappings=(ActionName="ToggleWingsuit",Key=E)
+ActionMappings=(ActionName="ToggleWingsuit",Key=Gamepad_FaceButton_Bottom)

; Camera toggle / cycle (names must match your C++ binds)
+ActionMappings=(ActionName="ToggleCameraMode",Key=C)
+ActionMappings=(ActionName="ToggleCameraMode",Key=Gamepad_RightShoulder)

+ActionMappings=(ActionName="CycleCameraDistance",Key=V)
+ActionMappings=(ActionName="CycleCameraDistance",Key=Gamepad_LeftShoulder)

; Parachute (reserve) : clavier P, manette = FaceButton_Top (Y)
+ActionMappings=(ActionName="DeployParachute",Key=P)
+ActionMappings=(ActionName="DeployParachute",Key=Gamepad_FaceButton_Top)

; Jump (espace). Note: Space is not used for ToggleWingsuit to avoid conflict.
+ActionMappings=(ActionName="Jump",Key=SpaceBar)
+ActionMappings=(ActionName="Jump",Key=Gamepad_FaceButton_Right)

